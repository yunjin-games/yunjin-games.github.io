</style><style media="screen">/* Design tokens */
:root {
  --color-canvas: #f8fafc;
  --color-surface: #fff;
  --color-border: #e2e8f0;
  --color-control-border: #64748b;
  --color-text: #0f172a;
  --color-muted: #475569;

  --status-active-bg: #dcfce7;
  --status-active-text: #166534;
  --status-rejected-bg: #fee2e2;
  --status-rejected-text: #991b1b;
  --status-neutral-bg: var(--color-hover);
  --status-neutral-text: #334155;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-control: 6px;
  --radius-panel: 8px;
  --radius-pill: 999px;
  --sidebar-width: 216px;
  --header-height: 56px;
  --control-height: 36px;
  --control-height-compact: 32px;
  --table-row-height: 44px;
  --detail-column-width: 114px;
  --focus-width: 2px;
  --font-sans: Pretendard, 'Yu Gothic UI', Meiryo, sans-serif;
  --font-label: 12px;
  --font-table: 13px;
  --font-body: 14px;
  --font-section: 16px;
  --font-title: 24px;
  --shadow-overlay: 0 6px 18px rgb(15 23 42 / 10%);
  --plum: var(--color-primary);
  --line: var(--color-border);
  --muted: var(--color-muted);
  color: var(--color-text);
  background: var(--color-canvas);
  font: var(--font-body)/1.5 var(--font-sans);
  font-variant-numeric: tabular-nums;
  color-scheme: light;
}

/* Shared controls and surfaces */
h2, h3 { font-size: var(--font-section); }
label { color: var(--color-text); font-size: var(--font-table); }
button, .button, .tool-menu summary, input, select, textarea {
  border-color: var(--color-control-border);
  border-radius: var(--radius-control);
  color: var(--color-text);
}
button, .button, .tool-menu summary { min-height: var(--control-height); font-weight: 650; }
input, select, textarea { min-height: var(--control-height); padding-block: 5px; }
textarea { min-height: 86px; }
input[type=checkbox] { accent-color: var(--color-primary); }
button:not(:disabled):hover, .button:hover, .tool-menu summary:hover { background: var(--color-hover); }
button.primary, .button.primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: var(--color-surface);
}
button.primary:not(:disabled):hover, .button.primary:hover {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
}
button:disabled, .list-pager button:disabled, input:disabled, select:disabled, textarea:disabled {
  opacity: 1;
  border-color: var(--color-border);
  background: var(--color-disabled-bg);
  color: var(--color-muted);
  cursor: default;
}
:focus-visible, .file-pick:focus-within {
  outline: var(--focus-width) solid var(--color-focus);
  outline-offset: 2px;
}
.grid-tools button, .grid-actions button, .grid-actions .button, .tool-menu summary, .list-pager button {
  min-height: var(--control-height-compact);
  font-size: var(--font-table);
}
.demo-dialog, .panel, .menu-popover, .jp-calendar { background: var(--color-surface); border-radius: var(--radius-panel); }
.panel { border-color: var(--color-border); padding: var(--space-4); margin-bottom: var(--space-4); }
.menu-popover, .jp-calendar { box-shadow: var(--shadow-overlay); }
.status {
  max-width: 100%;
  padding: 3px var(--space-2);
  border-radius: var(--radius-pill);
  background: var(--status-neutral-bg);
  color: var(--status-neutral-text);
  font-size: var(--font-label);
}
.status[data-status=DRAFT] { background: var(--status-pending-bg); color: var(--status-pending-text); }
.status[data-status=APPROVED] { background: var(--status-approved-bg); color: var(--status-approved-text); }
.status[data-status=ACTIVE] { background: var(--status-active-bg); color: var(--status-active-text); }
.status[data-status=REJECTED] { background: var(--status-rejected-bg); color: var(--status-rejected-text); }

/* Application shell */
html { scroll-padding-top: calc(var(--header-height) + var(--space-2)); }
body { grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.sidebar {
  width: var(--sidebar-width);

function normalize(details = {}) {
  if (!details || typeof details !== 'object') throw Error('入力内容が正しくありません。');
  return Object.fromEntries(Object.entries(blank).map(([section, values]) => {
    const source = details[section] ?? {};
    return [section, Object.fromEntries(Object.entries(values).map(([key, fallback]) => {
      const value = source[key] ?? fallback;
      if (typeof fallback === 'number') {
        const n = value === '' ? 0 : Number(value);
        if (!Number.isSafeInteger(n) || n < 0 || n > maxYen) throw Error('金額・日数は正の整数で入力してください。');
        return [key, n];
      }
      if (typeof value !== 'string' || value.length > 2000) throw Error('入力内容が長すぎるか、形式が正しくありません。');
      return [key,value.trim()];
    }))];
  }));
}

function dateOrNull(value) {

function groupedFields(fields, groups, renderField) {

  function group(title, items) {
    return `<section class="field-group"><h3>${title}</h3><div class="fields">${items.map(renderField).join('')}</div></section>`;

  const result=groups.map(([title,keys])=>group(title,keys.split(' ').flatMap(key=>{
    const item=lookup.get(key);

  }))).join('');

const padDate = value => String(value).padStart(2,'0');
function dateParts(value) {
  const match=/^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(value);
  if (!match) return null;
  const [year,month,day]=match.slice(1).map(Number);
  if (!year || month<1 || month>12) return null;
  if (match[3] && (!day || day>calendarDate(year,month+1,0).getUTCDate())) return null;
  return {year,month,day};
}
function calendarDate(year,month,day) {
  const date=new Date(0);
  date.setUTCFullYear(year,month-1,day);
  return date;
}
function validateCalendarValue(input) {
  const parts=dateParts(input.value);
  const error=!input.value
    ? (input.required?'日付を入力してください。':'')
    : (parts && (input.dataset.jpDate==='date' ? parts.day : !parts.day)?'':
      (input.dataset.jpDate==='date'?'日付を YYYY-MM-DD 形式で入力してください。':'年月を YYYY-MM 形式で入力してください。'));
  input.setCustomValidity(error);
}
document.addEventListener('input',event=>{

let dismissCalendar;
document.addEventListener('click',event=>{
  const trigger=event.target.closest('[data-calendar]');
  if (!trigger) return;
  const input=trigger.parentElement.querySelector('[data-jp-date]');
  if (!input.disabled) openCalendar(trigger,input);

function openCalendar(trigger,input) {
  const alreadyOpen=trigger.getAttribute('aria-expanded')==='true';
  dismissCalendar?.();
  if (alreadyOpen) return;
  const monthOnly=input.dataset.jpDate==='month';
  const todayValue=today();
  const current=dateParts(todayValue);
  const selected=dateParts(input.value);
  let {year,month}=selected || current;
  const popup=document.createElement('div');
  popup.className='jp-calendar';
  popup.setAttribute('popover','auto');
  popup.setAttribute('role','dialog');
  popup.setAttribute('aria-label',monthOnly?'年月を選択':'日付を選択');
  (trigger.closest('dialog') || document.body).append(popup);
  const usePopover=typeof popup.showPopover==='function';
  if (!usePopover) popup.classList.add('calendar-fallback');
  trigger.setAttribute('aria-expanded','true');
  const cleanup=()=>{
    popup.remove();
    trigger.setAttribute('aria-expanded','false');
    if (dismissCalendar===cleanup) dismissCalendar=undefined;
  };
  dismissCalendar=cleanup;
  popup.addEventListener('toggle',event=>{if(event.newState==='closed') cleanup();});
  popup.addEventListener('keydown',event=>{
    if(event.key!=='Escape') return;
    event.preventDefault();
    event.stopPropagation();
    cleanup();
    trigger.focus();
  });
  function pick(value) {
    input.value=value;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
    cleanup();
    trigger.focus();
  }
  function position() {
    const rect=trigger.parentElement.getBoundingClientRect();
    const left=Math.max(8,Math.min(rect.left,window.innerWidth-popup.offsetWidth-8));
    const below=rect.bottom+6;
    const top=below+popup.offsetHeight<=window.innerHeight-8?below:Math.max(8,rect.top-popup.offsetHeight-6);
    popup.style.left=`${left}px`;
    popup.style.top=`${top}px`;
  }
  function draw(focus) {
    const caption=monthOnly?`${year}年`:`${year}年${month}月`;
    const offset=calendarDate(year,month,1).getUTCDay();
    const days=calendarDate(year,month+1,0).getUTCDate();
    const options=monthOnly ? Array.from({length:12},(_,i)=>i+1) : Array.from({length:days},(_,i)=>i+1);
    const weeks=monthOnly?'':['日','月','火','水','木','金','土'].map(day=>`<span aria-hidden="true">${day}</span>`).join('')+'<span></span>'.repeat(offset);
    popup.innerHTML=`<div class="calendar-head"><button type="button" data-step="-1" aria-label="${monthOnly?'前年':'前月'}">${icon('left')}</button><strong aria-live="polite">${caption}</strong><button type="button" data-step="1" aria-label="${monthOnly?'翌年':'翌月'}">${icon('right')}</button></div>
      <div class="calendar-choices ${monthOnly?'months':''}">${weeks}${options.map(n=>{
        const value=`${String(year).padStart(4,'0')}-${padDate(monthOnly?n:month)}${monthOnly?'':'-'+padDate(n)}`;
        const label=monthOnly?`${year}年${n}月`:`${caption}${n}日`;
        return `<button type="button" data-date="${value}" aria-label="${label}" aria-pressed="${value===input.value}"${value===(monthOnly?todayValue.slice(0,7):todayValue)?' aria-current="date"':''}>${n}${monthOnly?'月':''}</button>`;
      }).join('')}</div><div class="calendar-foot"><button type="button" data-clear>クリア</button><button type="button" data-today>${monthOnly?'今月':'今日'}</button></div>`;
    position();
    if(focus) popup.querySelector(focus)?.focus({preventScroll:true});
  }
  popup.onclick=event=>{
    const button=event.target.closest('button');
    if (!button) return;
    if (button.hasAttribute('data-clear')) return pick('');
    if (button.hasAttribute('data-today')) return pick(monthOnly?today().slice(0,7):today());
    if (button.dataset.date) return pick(button.dataset.date);
    const step=Number(button.dataset.step);
    const next=calendarDate(year+(monthOnly?step:0),month+(monthOnly?0:step),1);
    if(next.getUTCFullYear()<1 || next.getUTCFullYear()>9999) return;
    year=next.getUTCFullYear();
    month=next.getUTCMonth()+1;
    draw(`[data-step="${step}"]`);
  };
  if(usePopover) popup.showPopover();
  draw();
  (popup.querySelector('[aria-pressed="true"]') || popup.querySelector('[aria-current="date"]') ||
    popup.querySelector('[data-date]'))?.focus({preventScroll:true});
}

  function cellValue(row,key,value,numeric) {
    if (key==='status') return badge(row.status);
    const result=value(row);
    return numeric && result!=null ? money(result) : clean(result || '—');
  }
  function detailField(row,[key,label,value,numeric]) {
    return `<div data-detail-field="${key}"><dt>${label}</dt><dd>${cellValue(row,key,value,numeric)}</dd></div>`;
  }
  function detailPanel(row,contractLink) {
    const missing=[];
    const fields=keys=>keys.map(key=>columnsByKey.get(key));
    const list=items=>items.map(column=>detailField(row,column)).join('');
    const filledItems=(keys,empty)=>fields(keys).filter(column=>{
      const value=column[2](row);
      if (value!=null && String(value).trim() && value!=='—') return true;
      empty.push(column);
      return false;
    });
    const cards=detailGroups.map(([title,mark,keys,parts=[]])=>{
      const empty=[];
      const populated=filledItems(keys,empty);
      const subgroups=parts.map(([label,partKeys])=>{
        const items=list(filledItems(partKeys,empty));
        return items?`<div class="detail-slot"><h4>${label}</h4><dl>${items}</dl></div>`:'';
      }).join('');
      if (empty.length) missing.push([title,empty]);
      if (!populated.length && !subgroups) return '';
      return `<section class="detail-card"><h3>${icon(mark)}${title}</h3>${populated.length?`<dl>${list(populated)}</dl>`:''}${subgroups}</section>`;
    }).join('');
    const missingCount=missing.reduce((count,[,items])=>count+items.length,0);
    const optional=missingCount?`<details class="detail-unset"><summary>${icon('chevron')}未登録の項目 <span>${missingCount}件</span></summary>
      <div class="detail-unset-groups">${missing.map(([title,items])=>`<section><h3>${title}</h3><dl>${list(items)}</dl></section>`).join('')}</div></details>`:'';
    return `<section class="contract-detail" aria-labelledby="detail-title-${row.id}">
      <div class="detail-banner"><h2 id="detail-title-${row.id}">${icon('file')}契約詳細</h2><span>契約 #${row.id}</span></div>
      <div class="detail-summary">
        <div class="detail-identity"><span class="detail-property-icon">${icon('building')}</span><dl>${list(fields(['property','unit']))}</dl></div>
        <div class="detail-summary-side"><dl>${list(fields(['status','monthly']))}</dl>${contractLink}</div>
      </div><div class="detail-cards">${cards}</div>${optional}
    </section>`;
  }
  function gridRow(row,cols) {
    const isOpen=row.id===expanded;
    const detailId=`grid-detail-${row.id}`;
    const cells=cols.map(([key,label,value,numeric])=>{
      const content=cellValue(row,key,value,numeric);
      const cell=demoMode?`<span class="grid-value" title="${key==='status'?clean(labels[row.status]):content}">${content}</span>`:content;
      return `<td data-label="${label}" class="${numeric?'grid-number':''}">${cell}</td>`;
    }).join('');
    let details='';
    if (isOpen) {
      const contractLink=`<a class="button" href="#contract/${row.id}">${icon('file')}契約台帳を開く</a>`;
      const content=demoMode?detailPanel(row,contractLink):`<dl>${columns.map(column=>detailField(row,column)).join('')}</dl>${contractLink}`;
      details=`<tr class="expanded-row" id="${detailId}"><td colspan="${cols.length+1}">${content}</td></tr>`;
    }
    const toggleLabel=isOpen?'詳細を閉じる':'詳細を開く';
    const toggleVisible=demoMode?`<span>${toggleLabel}</span>`:'';
    return `<tr data-contract="${row.id}" class="${row.id===selected?'selected':''}${isOpen&&demoMode?' detail-open':''}">${cells}<td class="expand-cell"><button type="button" class="${demoMode?'detail-toggle':'icon-button'}" data-expand="${row.id}" aria-label="契約 #${row.id} の${toggleLabel}" aria-expanded="${isOpen}" ${isOpen?`aria-controls="${detailId}"`:''}>${toggleVisible}${icon('chevron')}</button></td></tr>${details}`;
  }
  function showRows() {
    const cols=activeColumns();
    currentRows=sourceRows.filter(row=>cols.every(([key,,value])=>String(value(row)??'').toLocaleLowerCase('ja').includes((filters.get(key)||'').trim().toLocaleLowerCase('ja'))));
    const sortColumn=columns.find(([key])=>sort.key===key);
    if(sortColumn) {
      const [,,value,numeric]=sortColumn;
      currentRows.sort((a,b)=>sort.direction*(numeric?Number(value(a)||0)-Number(value(b)||0):
        String(value(a)??'').localeCompare(String(value(b)??''),'ja',{numeric:true})));
    }
    page=Math.min(page,Math.max(1,Math.ceil(currentRows.length/limit)));
    const visibleRows=currentRows.slice((page-1)*limit,page*limit);
    if (!visibleRows.some(row=>row.id===selected)) selected=visibleRows[0]?.id;
    view.querySelector('#count').textContent=`${currentRows.length} 件`;
    if (filterCount) {
      const active=appliedFormFilters+[...filters.values()].filter(value=>value.trim()).length;
      const label=`適用中の検索条件：${active}`;
      if (filterCount.textContent!==label) filterCount.textContent=label;
      filterCount.classList.toggle('has-filters',active>0);
    }
    if (!visibleRows.some(row=>row.id===expanded)) expanded=undefined;
    const empty=demoMode?`<div class="search-empty">${icon('search')}<strong>一致する契約がありません</strong><p>キーワードや検索条件を見直してください。</p><button type="reset" form="contract-search-form">条件をクリア</button></div>`:'該当するデータはありません。';
    grid.querySelector('tbody').innerHTML=visibleRows.length?visibleRows.map(row=>gridRow(row,cols)).join(''):`<tr class="empty-row"><td colspan="${cols.length+1}">${empty}</td></tr>`;
    listPager(pager,page,currentRows.length,limit,next=>{page=next;showRows();});
    drawActions();
  }
  function drawActions() {
    const row=currentRows.find(r=>r.id===selected);
    const target=view.querySelector('#grid-actions');
    target.innerHTML=row?`<span class="selection-label">選択中 <strong>${clean(row.details.party.name)}</strong></span><a class="button" href="#contract/${row.id}">${icon('file')}契約内容・変更</a><a class="button" href="#contract/${row.id}/payments">${icon('coins')}入金状況</a><details class="tool-menu row-menu"><summary>${icon('dots')}その他の操作</summary><div class="menu-popover"><a class="button" href="#contract/${row.id}/end">退居・終了</a></div></details>`:'';
    if (row && typeof renderDemoActions==='function') renderDemoActions(target.querySelector('.menu-popover'),row);
  }
  grid.onclick=event=>{
    if (event.target.closest('.search-empty button')) form.elements.q.focus();
    const expander=event.target.closest('[data-expand]');
    if (expander) {
      selected=Number(expander.dataset.expand);
      expanded=expanded===selected?undefined:selected;
      showRows();
      grid.querySelector(`[data-expand="${selected}"]`).focus({preventScroll:true});
      if (demoMode && expanded===selected) grid.querySelector('.detail-banner').scrollIntoView({block:'nearest'});
      return;
    }
    const key=event.target.closest('[data-sort]')?.dataset.sort;
    if (key) {
      sort={key,direction:sort.key===key?-sort.direction:1};
      page=1;
      drawGrid();
      grid.querySelector(`[data-sort="${key}"]`).focus({preventScroll:true});
      return;
    }
    const row=event.target.closest('[data-contract]');
    if (row && !event.target.closest('a')) {selected=Number(row.dataset.contract);showRows();}
  };
  grid.oninput=event=>{
    if (!event.target.dataset.filter) return;
    filters.set(event.target.dataset.filter,event.target.value);
    page=1;
    showRows();
  };
  view.querySelector('#grid-print').onclick=()=>{
    const cols=activeColumns();
    view.querySelector('#grid-print-sheet').innerHTML='<h1>契約検索結果一覧</h1>'+
      table(cols.map(([,label])=>label),currentRows.map(row=>cols.map(([, ,value,numeric])=>numeric&&value(row)!=null?money(value(row)):clean(value(row)))));
    window.print();
  };
  view.querySelector('#export').onclick=()=>{
    const cols=columns;
    const headers=cols.map(([,label])=>label);
    const rows=currentRows.map(row=>cols.map(([, ,value])=>value(row)));
    const encode=value=>{
      const text=String(value ?? '');
      const safe=/^[\s]*[=+\-@\t\r]/.test(text)?`'${text}`:text;
      return `"${safe.replaceAll('"','""')}"`;
    };
    const url=URL.createObjectURL(new Blob(['\uFEFF',[headers,...rows].map(row=>row.map(encode).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download='契約検索結果.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  async function refresh() {
    const current=++request;
    const criteria=Object.fromEntries(new FormData(form));
    const rows=await api('contracts?'+new URLSearchParams(new FormData(form)));
    if (current!==request || token!==renderCount) return;
    if (filterCount) appliedFormFilters=Object.values(criteria).filter(value=>value.trim()).length;
    page=1;
    const contains=(key,value)=>String(value||'').toLowerCase().includes(criteria[key].trim().toLowerCase());
    const inRange=(value,from,to)=>(!from || (value && value>=from)) && (!to || (value && value<=to));
    const stateFilters=[
      [criteria.currentState,row=>['DRAFT','APPROVED','ACTIVE'].includes(row.status)],
      [criteria.moveOutState,row=>row.status==='ACTIVE' && row.moveOutOn],
      [criteria.endedState,row=>row.status==='ENDED'],
      [criteria.cancelledState,row=>row.status==='CANCELLED'],
      [criteria.previousState,row=>row.status==='PREVIOUS'],
    ].filter(([on])=>on);
    sourceRows=rows.filter(row=>contains('branch',row.branch) && contains('manager',row.details.application.manager)
      && contains('employer',[row.details.party.employer,row.details.occupant?.employer].join(' ')) && contains('address',row.address)
      && contains('vehicle',row.details.party.vehicleNo) && (!criteria.partyType || criteria.partyType===row.details.party.type)
      && (!criteria.target || (criteria.target==='parking'?Boolean(row.parking):criteria.target==='room'?Boolean(row.unit_id):row.unit_id===null))
      && (!criteria.subleaseOnly || row.details.application.sublease==='yes')
      && (!criteria.fixedTermOnly || row.details.application.leaseType?.includes('定期'))
      && (!criteria.shortfallOnly || Number(row.details.charges.moveOutShortfall)>0)
      && (!criteria.hideOtherCompany || row.details.application.otherCompany!=='yes')
      && (stateFilters.length?stateFilters.some(([,matches])=>matches(row)):(criteria.status || !['CANCELLED','PREVIOUS'].includes(row.status)))
      && inRange(row.starts_on,criteria.startFrom,criteria.startTo)
      && inRange(row.details.renewal.nextOn,criteria.renewFrom,criteria.renewTo));
    drawGrid();
  }
  const searchButton=form.querySelector('[type=submit]');
  form.onsubmit=e=>{e.preventDefault();submit(searchButton,refresh);};
  form.onreset=()=>queueMicrotask(()=>{
    form.property.onchange();
    filters.clear();
    submit(searchButton,refresh);
  });
  await refresh();
}

function masterPage(kind) {
  const names={properties:'物件管理',units:'部屋管理',parking:'駐車区画'};
  const propertyName=id=>master.properties.find(p=>p.id===id)?.name;
  const cols={properties:demoMode?['物件番号','物件名','所在地','管理店','家主名']:['物件名','所在地','管理店'],
    units:['物件','部屋番号','間取り','月額家賃'],parking:['物件','区画番号','月額利用料','契約状況','契約期間','契約台帳']};
  const titles={properties:'物件一覧',units:'部屋一覧',parking:'駐車区画一覧'};
  const register=`<button type="button" class="primary" id="master-add">${icon('plus')}新規登録</button>`;
  const contractLink=kind==='parking'?`<a class="button" href="#${demoMode?'new-parking':'new'}">${icon('parking')}${demoMode?'駐車場単独の申込':'駐車区画付き申込'}</a>`:'';
  view.innerHTML=heading(names[kind],'',`<div class="heading-actions">${contractLink}${register}</div>`)
    +`<section class="panel master-panel"><div class="results-heading"><h2>${titles[kind]} <small id="master-count"></small></h2>
    <label class="master-search"><span class="sr-only">${titles[kind]}を検索</span><span class="keyword-input">${icon('search')}<input id="master-search" type="search" placeholder="キーワードで絞り込む"></span></label></div>
    <div id="master-list"></div><nav class="list-pager" aria-label="${titles[kind]}のページ"></nav></section>`;
  const list=view.querySelector('#master-list');
  const search=view.querySelector('#master-search');
  const pager=view.querySelector('.list-pager');
  const count=view.querySelector('#master-count');
  const add=view.querySelector('#master-add');
  const limit=listLimit(290,34);
  let page=1;
  function entries(item) {
    if (kind==='properties') return demoMode?[item.code||String(item.id),item.name,item.address,item.branch,item.ownerName]:[item.name,item.address,item.branch];
    const base=[propertyName(item.property_id),item.label];
    if (kind==='units') return [...base,item.floor_plan,money(item.rent)];
    return [...base,money(item.fee),item.active_contract_id?'契約中':'空き',item.active_contract_id?`${item.starts_on} ～ ${item.ends_on}`:'—'];
  }
  function draw() {
    const term=search.value.trim().toLocaleLowerCase('ja');
    const filtered=master[kind].filter(item=>entries(item).some(value=>String(value??'').toLocaleLowerCase('ja').includes(term)));
    count.textContent=`${filtered.length} 件`;
    page=Math.min(page,Math.max(1,Math.ceil(filtered.length/limit)));
    const rows=filtered.slice((page-1)*limit,page*limit).map(item=>{
      const cells=entries(item).map(clean);
      if (kind!=='parking') return cells;
      return [...cells,item.active_contract_id?`<a class="master-link" href="#contract/${item.active_contract_id}">契約を開く</a>`:'—'];
    });
    list.innerHTML=table(cols[kind],rows);
    listPager(pager,page,filtered.length,limit,next=>{page=next;draw();});
  }
  search.oninput=()=>{page=1;draw();};
  add.onclick=()=>{
    const fields=kind==='properties'?field('name','物件名','text','',true)+field('address','所在地','text','',true)+field('branch','管理店','text','',true)+
      (demoMode?field('code','物件番号')+field('ownerName','家主名')+field('ownerPhone','家主TEL','tel'):''):
      `<label>物件<select name="property" required><option value="">選択してください</option>${propertyOptions()}</select></label>`+field('label',cols[kind][1],'text','',true)+(kind==='units'?field('floorPlan','間取り','text','',true):'')+field('fee',kind==='units'?'月額家賃':'月額利用料','number',0,true);
    const dialog=document.createElement('dialog');
    dialog.className='demo-dialog master-dialog';
    dialog.innerHTML=`<h2>${names[kind]}の新規登録</h2><form><div class="fields">${fields}</div><p class="review-note" role="alert"></p><div class="actions"><button class="primary" type="submit">登録する</button><button type="button" data-close>キャンセル</button></div></form>`;
    const form=dialog.querySelector('form');
    dialog.querySelector('[data-close]').onclick=()=>dialog.close();
    dialog.addEventListener('close',()=>{dialog.remove();add.focus({preventScroll:true});},{once:true});
    form.onsubmit=async event=>{
      event.preventDefault();
      event.submitter.disabled=true;
      try {
        await api(`master/${kind}`,'POST',Object.fromEntries(new FormData(form)));
        master=await api('master');
        search.value='';
        page=Math.max(1,Math.ceil(master[kind].length/limit));
        draw();
        dialog.close();
        toast('台帳に登録しました。');
      } catch (error) {dialog.querySelector('[role=alert]').textContent=error.message;}
      finally {event.submitter.disabled=false;}
    };
    document.body.append(dialog);
    dialog.showModal();
  };
  draw();
}

function contractPage(item, parkingOnly=item?.unit_id===null, section='') {
  const data=item?.details || {};
  const editable=!item || item.status==='DRAFT' || (typeof renderDemoContractTools==='function' && ['ACTIVE','APPROVED'].includes(item.status));
  const title=item ? `契約台帳 #${item.id}` : parkingOnly?'駐車場単独の新規申込':'新規申込';
  const total=`<div class="metrics"><div><small>月額合計（税込）</small><strong id="monthly">${money(item?.totals.monthly)}</strong></div><div><small>初期費用合計</small><strong id="initial">${money(item?.totals.initial)}</strong></div></div>`;
  const tabs=sectionOrder.map((key,i)=>`<button type="button" role="tab" data-tab="${key}" aria-controls="section-${key}" aria-selected="${i===0}">${sections[key][0]}</button>`).join('');
  const panels=sectionOrder.map((key,i)=>{
    const [name,fields]=sections[key];
    const renderField=([k,label,type,needed])=>field(`${key}.${k}`,label,type,data[key]?.[k] ?? (key==='application'&&k==='receivedOn'?today():key==='renewal'&&k==='noticeDays'?30:''),needed);
    let body;
    if(key==='related') {
      const householdTable=(rows,offset)=>table(['No.',...householdColumns.map(([,label])=>label)],rows.map((row,index)=>[
        offset+index,...row.map(([k,label,type])=>renderField([k,`${label} ${offset+index}`,type])),
      ]));
      const extraOpen=householdFields.slice(4).some(row=>row.some(([k])=>data.related?.[k]));
      const guarantors=fields.filter(([k])=>!k.startsWith('member') && k!=='occupants');
      const contacts=[['連帯保証人1',guarantors.filter(([k])=>k.startsWith('guarantor') && k!=='guaranteeCompany')],
        ['連帯保証人2',guarantors.filter(([k])=>k.startsWith('secondGuarantor'))],
        ['緊急連絡先・その他',fields.filter(([k])=>k.startsWith('emergency') || ['occupants','guaranteeCompany'].includes(k))]];
      body='<section class="field-group"><h3>同居人情報</h3>'+householdTable(householdFields.slice(0,4),1)+
        `<details class="search-more" ${extraOpen?'open':''}><summary>同居人 5〜10人目${icon('chevron')}</summary>${householdTable(householdFields.slice(4),5)}</details></section>`+
        contacts.map(([title,items])=>`<section class="field-group"><h3>${title}</h3><div class="fields">${items.map(renderField).join('')}</div></section>`).join('');
    } else if(key==='monthlyBilling') {
      const monthlyEditor=monthlyChargeItems.map(([fieldKey,label])=>[
        `<span data-monthly-label="${fieldKey}">${label}</span>`,`<span data-monthly-amount="${fieldKey}"></span>`,
        ...fields.filter(([key])=>[fieldKey+'Payer',fieldKey+'Days',fieldKey+'Amount'].includes(key)).map(renderField),
      ]);
      body='<p class="review-note">日割日数と日割料金は確認用の手入力です。</p>'+
        table(['項目','月額','負担','日割日数','日割料金'],monthlyEditor);
    } else if(key==='billing') {
      body=`<p class="review-note">デモの初期費用を項目ごとの負担先で集計します。負担先が空欄の項目は契約区分で集計します。</p>
        <div class="metrics"><div><small>請求額（個人）</small><strong id="initial-personal"></strong></div><div><small>請求額（法人）</small><strong id="initial-corporate"></strong></div><div><small>手付金（別表示）</small><strong id="initial-advance"></strong></div></div>`+
        table(['項目','金額','負担'],fields.map(([fieldKey,label,type])=>[
          `<span data-initial-label="${fieldKey}">${label.replace(/の負担$/,'')}</span>`,`<span data-bill-amount="${fieldKey}"></span>`,
          renderField([fieldKey,label,type]),
        ]));
    } else if(contractGroups[key]) body=groupedFields(fields,contractGroups[key],renderField);
    else body=`<div class="fields">${fields.map(renderField).join('')}</div>`;
    return `<section id="section-${key}" data-panel="${key}" ${i?'hidden':''}><h2>${name}</h2>${body}</section>`;
  }).join('');
  const transitions={DRAFT:[['approve','審査を承認'],['reject','却下する']],APPROVED:[['activate','契約を確定']],ACTIVE:[['renew','契約更新'],['end','契約終了']]};
  if(demoMode) for (const state of ['DRAFT','APPROVED']) transitions[state].push(['cancel','申込をキャンセル']);
  const commands=item?(transitions[item.status]||[]):[];
  const commandButton=([command,label])=>`<button type="button" data-command="${command}">${label}</button>`;
  const endCommand=section==='end' && commands.find(([command])=>command==='end');
  const controls=commands.filter(command=>command!==endCommand).map(commandButton).join('');
  const endPanel=section==='end'?`<section class="panel contract-end-panel"><h2>退居・契約終了</h2>
    ${endCommand?commandButton(endCommand):`<p>契約状況 ${badge(item.status)}</p>`}</section>`:'';
  const history=item?`<section class="panel"><h2>操作履歴</h2><ul class="history">${item.events.map(e=>`<li>${clean(new Date(e.created_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))}　${clean(e.event)}</li>`).join('')}</ul></section>`:'';
  const paymentForm=item && ['APPROVED','ACTIVE'].includes(item.status)?`<form id="payment"><div class="filters">${field('receivedOn','入金日','date',today(),true)}${field('amount','入金額','number','',true)}${demoMode?field('payer','入金区分','payer',item.details.party.type,true):''}${field('memo','メモ')}<button>入金を記録</button></div></form>`:'';
  const payments=item?`<section class="panel" id="payment-history"><h2>入金履歴 <small>${item.payments.length} 件 / 合計 ${money(item.payments.reduce((s,p)=>s+p.amount,0))}</small></h2>
    ${demoMode?['個人','法人'].map(payer=>{
      const records=item.payments.filter(p=>(p.payer||item.details.party.type||'個人')===payer);
      const total=records.reduce((sum,p)=>sum+p.amount,0);
      return `<section class="field-group"><h3>${payer}の入金 · ${records.length}件 · ${money(total)}</h3>${table(['入金日','入金額','メモ'],records.map(p=>[clean(p.received_on),money(p.amount),clean(p.memo)]))}</section>`;
    }).join(''):table(['入金日','入金額','メモ'],item.payments.map(p=>[clean(p.received_on),money(p.amount),clean(p.memo)]))}${paymentForm}</section>`:'';

async function render() {
  dismissCalendar?.();

  const route=location.hash.slice(1)||'search';
  const masterRoutes=['properties','units','parking','new-parking'];
  const menuRoute=demoMode && masterRoutes.includes(route)?'master':/^(contract\/|new$)/.test(route)?'search':route;
  document.querySelectorAll('.sidebar nav a').forEach(link=>{
    const active=link.hash===`#${menuRoute}`;
    link.classList.toggle('active',active);
    if(active) link.setAttribute('aria-current','page');
    else link.removeAttribute('aria-current');
  });
  document.querySelector('.demo-tools details')?.removeAttribute('open');
  let scrollTarget;
  try {
    if (!master || route==='parking') master=await api('master');
    if(token!==renderCount)return;
    if(demoMode && demoWorkPage(route)) return;
    if(route==='new' || (demoMode && route==='new-parking')) {
      contractPage(undefined,route==='new-parking');
      return;
    }
    if(/^contract\/\d+(\/(payments|end))?$/.test(route)) {
      const [,id,section]=route.split('/');
      const item=await api(`contracts/${id}`);
      if(token!==renderCount)return;
      contractPage(item,item.unit_id===null,demoMode?section:'');
      if(!demoMode && section) scrollTarget=view.querySelector(section==='payments'?'#payment-history':'#editor .actions');
      return;
    }
    if(['units','properties','parking'].includes(route)) {
      masterPage(route);
      return;
    }
    await searchPage(token);
  } catch(error) {
    if(token===renderCount) {
      const title=headerAction?heading('読込エラー',''):'<h1>読込エラー</h1>';
      view.innerHTML=`<section class="panel">${title}<p>${clean(error.message)}</p><a href="#search">検索一覧へ</a></section>`;
    }
  } finally {
    if(token===renderCount) {
      if(scrollTarget) scrollTarget.scrollIntoView();
      else window.scrollTo(0,0);
      if(demoMode && renderedRoute!==route) crumb.focus({preventScroll:true});
      renderedRoute=route;
    }
  }
}

function demoRequest(path,method,body) {

        const end=dateOrNull(body.endsOn);
        demoCheck(end && end>contract.ends_on,'更新後の終了日は現在の終了日より後にしてください。');
        contract.ends_on=end;
      }
      if (body.action==='end' && !contract.movedOutOn) contract.movedOutOn=today();
      contract.status=status;
      contract.revision++;
      demoEvent(contract,{approve:'審査を承認',reject:'審査を却下',activate:'契約を確定',renew:'契約を更新',end:'契約を終了',cancel:'申込をキャンセル'}[body.action]);
    }
    if (action==='payments') {
      const amount=Number(body.amount), received_on=dateOrNull(body.receivedOn);
      demoCheck(['APPROVED','ACTIVE'].includes(contract.status) && received_on && Number.isInteger(amount) &&
        amount>0 && amount<=maxYen,'入金日と入金額を確認してください。');
      const payer=body.payer==='法人'?'法人':'個人';
      contract.payments.unshift({amount,received_on,payer,memo:String(body.memo||'')});
      demoEvent(contract,'入金を記録');
    }
  }
  return demoDetail(contract);
}
async function demoApi(path,method='GET',body) {
  const result=demoRequest(path,method,body);
  if (method!=='GET') { persistDemo(); exportDemo(); }
  return structuredClone(result);
}

function demoDialog(title,content,save) {
  const dialog=document.createElement('dialog');
  dialog.className='demo-dialog';
  dialog.innerHTML=`<h2>${clean(title)}</h2><form>${content}<p role="alert" class="review-note"></p><div class="actions"><button class="primary">保存</button><button type="button" data-close>閉じる</button></div></form>`;
  document.body.append(dialog);
  dialog.querySelector('[data-close]').onclick=()=>dialog.close();
  dialog.addEventListener('close',()=>dialog.remove(),{once:true});
  dialog.querySelector('form').onsubmit=event=>{
    event.preventDefault();
    try {
      save(Object.fromEntries(new FormData(event.currentTarget)));
      persistDemo();
      exportDemo();
      dialog.close();
      toast('デモデータを保存しました。');
    } catch (error) { dialog.querySelector('[role=alert]').textContent=error.message; }
  };
  dialog.showModal();
}
function renderDemoActions(target,row) {

      field('date','退居予定日','date',contract.moveOutOn||'',true)+field('actual','退居日','date',contract.movedOutOn||'')+
      field('settled','退居精算日','date',contract.moveOutSettledOn||'')+
      field('reason','退居理由・精算メモ','textarea',contract.moveOutMemo||''),form=>{
      const date=dateOrNull(form.date);
      const notice=dateOrNull(form.notice), actual=dateOrNull(form.actual), settled=dateOrNull(form.settled);
      demoCheck(date && date>=contract.starts_on,'契約開始日以降の退居日を選択してください。');
      demoCheck(!notice || notice<=date,'退居通知日は退居予定日以前にしてください。');
      demoCheck(!settled || !actual || settled>=actual,'精算日は退居日以降にしてください。');
      contract.moveOutOn=date;
      contract.moveOutNotifiedOn=notice;
      contract.movedOutOn=actual;
      contract.moveOutSettledOn=settled;
      contract.moveOutMemo=form.reason.trim();
      demoEvent(contract,'退居予定：'+date+(contract.moveOutMemo?' '+contract.moveOutMemo:''));
    });
    target.append(moveOut);
  }
  const actions=[
    ['クレーム登録','相談・対応内容'],
    ['日報','日報メモ'],
    ['契約紐付け','関連契約'],
  ];
  for (const [title,label] of actions) {
    const button=document.createElement('button');
    button.type='button';
    button.textContent=title;
    button.onclick=()=>{
      const existing=contract.events.filter(event=>event.event.startsWith(title+'：'));
      const history=existing.length?`<ul>${existing.map(event=>`<li>${clean(event.event)}</li>`).join('')}</ul>`:'';
      const candidates=demo.contracts.filter(item=>item.id!==contract.id);
      const linking=title==='契約紐付け';
      if(linking && !candidates.length) {toast('紐付け先の契約がありません。',true);return;}
      const fields=linking?`<label>${label}<select name="value" required><option value="">選択してください</option>${candidates.map(item=>option(item.id,`#${item.id} ${item.details.party.name}`)).join('')}</select></label>`:field('value',label,'textarea','',true);
      demoDialog(title,history+fields,form=>{
        const value=form.value.trim();
        demoCheck(value,'内容を入力してください。');
        if(linking) {
          const related=candidates.find(item=>item.id===Number(value));
          demoCheck(related && !(contract.linkedContracts||[]).includes(related.id),'紐付け先を確認してください。');
          (contract.linkedContracts??=[]).push(related.id);
          demoEvent(related,`契約紐付け：#${contract.id}`);
        }
        demoEvent(contract,`${title}：${linking?'#':''}${value}`);
      });
    };
    target.append(button);
  }
}

const demoWorkTitles={
  home:'ホームメニュー',applications:'申込一覧',moveouts:'退居予定一覧',daily:'日報一覧',claims:'クレーム情報一覧',
  master:'マスタ管理','general-search':'汎用検索',occupancy:'入居状況報告書',reports:'管理レポート',screening:'審査',
};
function demoOccupancy() {
  return demo.properties.map(property=>{
    const units=demo.units.filter(unit=>unit.property_id===property.id);
    const spaces=demo.parking.filter(space=>space.property_id===property.id);
    return {
      name:property.name, branch:property.branch, units:units.length, spaces:spaces.length,
      usedUnits:units.filter(unit=>demoOccupied(unit.id,[])).length,
      usedSpaces:spaces.filter(space=>demoOccupied(null,[space.id])).length,
    };
  });
}

function demoWorkPage(route) {
  if (!Object.hasOwn(demoWorkTitles,route)) return false;
  const title=demoWorkTitles[route];
  const contracts=demo.contracts.slice().reverse().map(demoDetail);
  if (route==='home' || route==='master') {
    const cards=route==='master'?
      [['properties','building','物件管理',demo.properties.length],['units','room','部屋管理',demo.units.length],['parking','parking','駐車区画',demo.parking.length]]:
      [['search','search','契約・入居者検索',contracts.filter(row=>row.status!=='PREVIOUS').length],
       ['applications','file','申込一覧',contracts.filter(row=>['DRAFT','APPROVED'].includes(row.status)).length],
       ['moveouts','calendar','退居予定一覧',contracts.filter(row=>row.status==='ACTIVE' && row.moveOutOn).length],
       ['screening','file','審査',contracts.filter(row=>row.status==='DRAFT').length],
       ['master','building','マスタ管理',demo.properties.length],
       ['occupancy','room','入居状況報告書',demo.units.length]];
    view.innerHTML=heading(title,'')+`<div class="work-cards">${cards.map(([path,mark,label,count])=>
      `<a class="panel work-card" href="#${path}">${icon(mark)}<span>${label}</span><strong>${count}件</strong></a>`).join('')}</div>`;
    return true;
  }
  const basic=['受付番号','物件・部屋','契約者','受付・契約状況'];
  const basicRows=row=>[row.details.application.receiptNo||'—',row.property+' / '+row.unit,row.details.party.name,labels[row.status]];
  const destination=row=>'#contract/'+row.id;
  let headers,rows;
  if (route==='applications' || route==='screening') {
    const waiting=route==='screening'?['DRAFT','APPROVED','REJECTED']:['DRAFT','APPROVED','CANCELLED','REJECTED'];
    headers=[...basic,route==='screening'?'審査結果・担当':'申込日'];
    rows=contracts.filter(row=>waiting.includes(row.status)).map(row=>({
      cells:[...basicRows(row),route==='screening'?[row.details.review.guaranteeResult,row.details.review.reviewer].filter(Boolean).join(' / '):row.details.application.receivedOn],
      href:destination(row),
    }));
  } else if(route==='moveouts') {
    headers=[...basic,'退居通知日','退居予定日','退居日','退居精算日'];
    rows=contracts.filter(row=>row.moveOutOn && ['ACTIVE','ENDED'].includes(row.status)).sort((a,b)=>a.moveOutOn.localeCompare(b.moveOutOn))
      .map(row=>({cells:[...basicRows(row),row.moveOutNotifiedOn,row.moveOutOn,row.movedOutOn,row.moveOutSettledOn],href:destination(row)}));
  } else if(route==='daily' || route==='claims') {
    headers=['記録日時','物件・部屋','契約者','内容'];
    const prefix=route==='daily'?'日報：':'クレーム登録：';
    rows=contracts.filter(row=>row.status!=='PREVIOUS').flatMap(row=>row.events.filter(event=>event.event.startsWith(prefix))
      .map(event=>({cells:[new Date(event.created_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}),row.property+' / '+row.unit,
        row.details.party.name,event.event.slice(prefix.length)],href:destination(row),date:event.created_at})))
      .sort((a,b)=>b.date.localeCompare(a.date));
  } else if(route==='occupancy') {
    headers=['物件','管理店','部屋数','入居中','空室','駐車区画数','契約中','空き'];
    rows=demoOccupancy().map(row=>({cells:[row.name,row.branch,row.units,row.usedUnits,row.units-row.usedUnits,row.spaces,
      row.usedSpaces,row.spaces-row.usedSpaces],href:'#units'}));
  } else if(route==='reports') {
    headers=['管理店','物件数','入居中の部屋','空室','契約中の駐車区画','空き区画'];
    const branches=new Map();
    for (const row of demoOccupancy()) {
      const total=branches.get(row.branch)||[0,0,0,0,0];
      [1,row.usedUnits,row.units-row.usedUnits,row.usedSpaces,row.spaces-row.usedSpaces].forEach((value,i)=>{total[i]+=value;});
      branches.set(row.branch,total);
    }
    rows=[...branches].map(([branch,counts])=>({cells:[branch,...counts],href:'#occupancy'}));
  } else {
    headers=['種別','名前・番号','物件','関連情報'];
    rows=[
      ...demo.properties.map(row=>({cells:['物件',row.name,row.code,row.ownerName||row.address],href:'#properties'})),
      ...demo.units.map(row=>({cells:['部屋',row.label,demo.properties.find(p=>p.id===row.property_id)?.name,row.floor_plan],href:'#units'})),
      ...demo.parking.map(row=>({cells:['駐車区画',row.label,demo.properties.find(p=>p.id===row.property_id)?.name,money(row.fee)],href:'#parking'})),
      ...contracts.filter(row=>row.status!=='PREVIOUS').map(row=>({cells:['契約',row.details.party.name,row.property,labels[row.status]],href:destination(row)})),
    ];
  }
  const report=route==='occupancy' || route==='reports';
  const note=route==='screening'?'登録された審査状況を確認できます。':'';
  const action=route==='applications'?'<a class="button primary" href="#new">新規申込</a>':
    ['moveouts','daily','claims'].includes(route)?'<a class="button" href="#search">契約を選ぶ</a>':'';
  view.innerHTML=heading(title,note,action)+`<section class="panel master-panel"><div class="results-heading"><h2>一覧 <small id="work-count"></small></h2><div class="grid-tools">
    ${report?`<button type="button" id="work-print">${icon('print')}印刷</button>`:''}<label class="master-search"><span class="sr-only">一覧を検索</span><span class="keyword-input">${icon('search')}<input id="work-query" type="search" placeholder="キーワードで絞り込む"></span></label></div></div>
    <div id="work-list"></div><nav class="list-pager" aria-label="一覧のページ"></nav></section><article class="print-sheet" id="work-print-sheet"></article>`;
  const query=view.querySelector('#work-query');
  const limit=listLimit(290,34);
  let page=1;
  function visible() {
    const term=query.value.trim().toLocaleLowerCase('ja');
    return rows.filter(row=>row.cells.some(value=>String(value??'').toLocaleLowerCase('ja').includes(term)));
  }
  function draw() {
    const filtered=visible();
    view.querySelector('#work-count').textContent=`${filtered.length} 件`;
    view.querySelector('#work-list').innerHTML=table([...headers,'詳細'],
      filtered.slice((page-1)*limit,page*limit).map(row=>[...row.cells.map(value=>clean(value??'—')),`<a href="${row.href}">開く</a>`]));
    listPager(view.querySelector('.list-pager'),page,filtered.length,limit,next=>{page=next;draw();});
  }
  query.oninput=()=>{page=1;draw();};
  if(report) view.querySelector('#work-print').onclick=()=>{
    view.querySelector('#work-print-sheet').innerHTML=`<h1>${title}</h1>`+table(headers,visible().map(row=>row.cells.map(clean)));
    window.print();
  };
  draw();
  return true;
}

function parseDemo(text) {
  const data=JSON.parse(text);
  const validId=value=>Number.isSafeInteger(value) && value>0;
  demoCheck(data?.version===1,'住まい台帳デモのJSONを選択してください。');
  for (const key of ['properties','units','parking','contracts']) {
    const rows=data[key];
    demoCheck(Array.isArray(rows) && rows.length<=1000 && rows.every(row=>validId(row?.id)) &&
      new Set(rows.map(row=>row.id)).size===rows.length,'台帳データを確認してください。');
  }
  const propertyExists=id=>data.properties.some(row=>row.id===id);
  for (const row of [...data.units,...data.parking]) {
    demoCheck(propertyExists(row.property_id),'物件情報を確認してください。');
  }
  for (const row of data.contracts) {
    const unit=data.units.find(unit=>unit.id===row.unit_id);
    const parking=data.parking.find(p=>p.id===row.parking_id);
    demoCheck((unit || (row.unit_id===null && parking)) && (row.parking_id===null || parking) &&
      ['DRAFT','APPROVED','ACTIVE','REJECTED','ENDED','CANCELLED','PREVIOUS'].includes(row.status) && validId(row.revision) &&
      Array.isArray(row.events) && row.events.every(event=>typeof event?.event==='string' && typeof event.created_at==='string') &&
      Array.isArray(row.payments) && row.payments.every(payment=>Number.isSafeInteger(payment?.amount) && payment.amount>0),'契約データを確認してください。');
    dateOrNull(row.starts_on);
    dateOrNull(row.ends_on);
    row.details=normalize(row.details);
    const extra=row.details.parkingDetails.secondSpaceId;
    const third=row.details.parkingDetails.thirdSpaceId;
    const spaceIds=demoParkingIds(row);
    demoCheck((!extra || parking) && (!third || extra) && new Set(spaceIds).size===spaceIds.length &&
      spaceIds.every(id=>data.parking.some(space=>space.id===id)),'駐車区画を確認してください。');
  }
  return data;
}
document.querySelector('#demo-export').onclick=exportDemo;
document.querySelector('#demo-import').onchange=async event=>{
  const control=event.currentTarget;
  try {
    const file=control.files[0];
    if (!file) return;
    demoCheck(file.size<=5_000_000,'JSONファイルは5 MBまでです。');
    const imported=parseDemo(await file.text());
    if (!confirm('このブラウザのデモデータをファイルの内容で置き換えますか？')) return;
    demo=imported;
    persistDemo();
    master=undefined;
    location.hash='search';
    await render();
    toast('デモデータを読み込みました。');
  } catch (error) { toast(error.message,true); }
  finally { control.value=''; }
};
