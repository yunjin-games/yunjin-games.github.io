    const source = details[section] ?? {};

}

function groupedFields(fields, groups, renderField) {
  const lookup=new Map(fields.map(field=>[field[0],field]));

    return `<section class="field-group"><h3>${title}</h3><div class="fields">${items.map(renderField).join('')}</div></section>`;
  }
  const result=groups.map(([title,keys])=>group(title,keys.split(' ').flatMap(key=>{
    const item=lookup.get(key);
    lookup.delete(key);
    return item?[item]:[];
  }))).join('');
  return result+(lookup.size?group('その他',[...lookup.values()]):'');
}

    return `<div class="date-field"><label>${clean(title)}<input ${shared} type="text" lang="ja" data-jp-date="${type}" autocomplete="off" spellcheck="false" maxlength="${placeholder.length}" pattern="${pattern}" placeholder="${placeholder}" value="${clean(value)}"></label><button type="button" data-calendar aria-label="${clean(title)}のカレンダーを開く" aria-expanded="false">${icon('calendar')}</button></div>`;
  }
  else if (type === 'secondSpace') control=`<select ${shared}></select>`;

  else control=`<input ${shared} type="${type}" value="${clean(value)}" ${type==='number'?'min="0" max="100000000" step="1"':'maxlength="240"'}>`;

}
const padDate = value => String(value).padStart(2,'0');
function dateParts(value) {
  const match=/^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(value);
  if (!match) return null;
  const [year,month,day]=match.slice(1).map(Number);
  if (!year || month<1 || month>12) return null;
  if (match[3] && (!day || day>calendarDate(year,month+1,0).getUTCDate())) return null;
  return {year,month,day};
}
function calendarDate(year,month,day) {
  const date=new Date(0);
  date.setUTCFullYear(year,month-1,day);
  return date;
}
function validateCalendarValue(input) {
  const parts=dateParts(input.value);
  const error=!input.value
    ? (input.required?'日付を入力してください。':'')
    : (parts && (input.dataset.jpDate==='date' ? parts.day : !parts.day)?'':
      (input.dataset.jpDate==='date'?'日付を YYYY-MM-DD 形式で入力してください。':'年月を YYYY-MM 形式で入力してください。'));
  input.setCustomValidity(error);
}
document.addEventListener('input',event=>{
  if (event.target.matches?.('[data-jp-date]')) validateCalendarValue(event.target);
});
document.addEventListener('invalid',event=>{
  if (event.target.matches?.('[data-jp-date]')) validateCalendarValue(event.target);
},true);

let dismissCalendar;
document.addEventListener('click',event=>{
  const trigger=event.target.closest('[data-calendar]');
  if (!trigger) return;
  const input=trigger.parentElement.querySelector('[data-jp-date]');
  if (!input.disabled) openCalendar(trigger,input);
});
function openCalendar(trigger,input) {
  const alreadyOpen=trigger.getAttribute('aria-expanded')==='true';
  dismissCalendar?.();
  if (alreadyOpen) return;
  const monthOnly=input.dataset.jpDate==='month';
  const todayValue=today();
  const current=dateParts(todayValue);
  const selected=dateParts(input.value);
  let {year,month}=selected || current;
  const popup=document.createElement('div');
  popup.className='jp-calendar';
  popup.setAttribute('popover','auto');
  popup.setAttribute('role','dialog');
  popup.setAttribute('aria-label',monthOnly?'年月を選択':'日付を選択');
  (trigger.closest('dialog') || document.body).append(popup);
  const usePopover=typeof popup.showPopover==='function';
  if (!usePopover) popup.classList.add('calendar-fallback');
  trigger.setAttribute('aria-expanded','true');
  const cleanup=()=>{
    popup.remove();
    trigger.setAttribute('aria-expanded','false');
    if (dismissCalendar===cleanup) dismissCalendar=undefined;
  };
  dismissCalendar=cleanup;
  popup.addEventListener('toggle',event=>{if(event.newState==='closed') cleanup();});
  popup.addEventListener('keydown',event=>{
    if(event.key!=='Escape') return;
    event.preventDefault();
    event.stopPropagation();
    cleanup();
    trigger.focus();
  });
  function pick(value) {
    input.value=value;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
    cleanup();
    trigger.focus();
  }
  function position() {
    const rect=trigger.parentElement.getBoundingClientRect();
    const left=Math.max(8,Math.min(rect.left,window.innerWidth-popup.offsetWidth-8));
    const below=rect.bottom+6;
    const top=below+popup.offsetHeight<=window.innerHeight-8?below:Math.max(8,rect.top-popup.offsetHeight-6);
    popup.style.left=`${left}px`;
    popup.style.top=`${top}px`;
  }
  function draw(focus) {
    const caption=monthOnly?`${year}年`:`${year}年${month}月`;
    const offset=calendarDate(year,month,1).getUTCDay();
    const days=calendarDate(year,month+1,0).getUTCDate();
    const options=monthOnly ? Array.from({length:12},(_,i)=>i+1) : Array.from({length:days},(_,i)=>i+1);
    const weeks=monthOnly?'':['日','月','火','水','木','金','土'].map(day=>`<span aria-hidden="true">${day}</span>`).join('')+'<span></span>'.repeat(offset);
    popup.innerHTML=`<div class="calendar-head"><button type="button" data-step="-1" aria-label="${monthOnly?'前年':'前月'}">${icon('left')}</button><strong aria-live="polite">${caption}</strong><button type="button" data-step="1" aria-label="${monthOnly?'翌年':'翌月'}">${icon('right')}</button></div>
      <div class="calendar-choices ${monthOnly?'months':''}">${weeks}${options.map(n=>{
        const value=`${String(year).padStart(4,'0')}-${padDate(monthOnly?n:month)}${monthOnly?'':'-'+padDate(n)}`;
        const label=monthOnly?`${year}年${n}月`:`${caption}${n}日`;
        return `<button type="button" data-date="${value}" aria-label="${label}" aria-pressed="${value===input.value}"${value===(monthOnly?todayValue.slice(0,7):todayValue)?' aria-current="date"':''}>${n}${monthOnly?'月':''}</button>`;
      }).join('')}</div><div class="calendar-foot"><button type="button" data-clear>クリア</button><button type="button" data-today>${monthOnly?'今月':'今日'}</button></div>`;
    position();
    if(focus) popup.querySelector(focus)?.focus({preventScroll:true});
  }
  popup.onclick=event=>{
    const button=event.target.closest('button');
    if (!button) return;
    if (button.hasAttribute('data-clear')) return pick('');
    if (button.hasAttribute('data-today')) return pick(monthOnly?today().slice(0,7):today());
    if (button.dataset.date) return pick(button.dataset.date);
    const step=Number(button.dataset.step);
    const next=calendarDate(year+(monthOnly?step:0),month+(monthOnly?0:step),1);
    if(next.getUTCFullYear()<1 || next.getUTCFullYear()>9999) return;
    year=next.getUTCFullYear();
    month=next.getUTCMonth()+1;
    draw(`[data-step="${step}"]`);
  };
  if(usePopover) popup.showPopover();
  draw();
  (popup.querySelector('[aria-pressed="true"]') || popup.querySelector('[aria-current="date"]') ||
    popup.querySelector('[data-date]'))?.focus({preventScroll:true});
}
function renewalDate(value) {
  return new Promise(resolve=>{
    const dialog=document.createElement('dialog');
    dialog.className='demo-dialog';
    dialog.innerHTML=`<h2>契約更新</h2><form>${field('endsOn','更新後の契約終了日','date',value,true)}
      <div class="actions"><button class="primary">更新する</button><button type="button" data-close>キャンセル</button></div></form>`;
    dialog.querySelector('form').onsubmit=event=>{
      event.preventDefault();
      dialog.close(new FormData(event.currentTarget).get('endsOn'));
    };
    dialog.querySelector('[data-close]').onclick=()=>dialog.close();
    dialog.addEventListener('close',()=>{
      dismissCalendar?.();
      dialog.remove();
      resolve(dialog.returnValue || null);
    },{once:true});
    document.body.append(dialog);
    dialog.showModal();
  });
}
const propertyOptions = () => master.properties.map(item=>option(item.id,item.name)).join('');
const unitOptions = units => units.map(item=>option(item.id,`${item.property} / ${item.label}（${item.floor_plan}）`)).join('');
const listLimit = (top, rowHeight) => window.innerWidth<=700 ? 8 :
  Math.max(6,Math.min(20,Math.floor((window.innerHeight-top)/rowHeight)));
function listPager(target,page,total,limit,changePage) {
  const pages=Math.max(1,Math.ceil(total/limit));
  target.hidden=pages===1;
  if (pages===1) {target.replaceChildren();return;}
  target.innerHTML=`<span>${(page-1)*limit+1}–${Math.min(page*limit,total)} / ${total}件</span>
    <div><button type="button" data-page="-1" ${page===1?'disabled':''}>${icon('left')}前へ</button>
    <span>${page} / ${pages}</span><button type="button" data-page="1" ${page===pages?'disabled':''}>次へ${icon('right')}</button></div>`;
  target.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{
    const direction=button.dataset.page;
    changePage(page+Number(direction));
    const next=target.querySelector(`[data-page="${direction}"]:not(:disabled)`);
    (next||target.querySelector('[data-page]:not(:disabled)'))?.focus({preventScroll:true});
  });
}

  await refresh();

function masterPage(kind) {
  const names={properties:'物件管理',units:'部屋管理',parking:'駐車区画'};
  const propertyName=id=>master.properties.find(p=>p.id===id)?.name;
  const cols={properties:['物件名','所在地','管理店'],units:['物件','部屋番号','間取り','月額家賃'],parking:['物件','区画番号','月額利用料','契約状況','契約期間','契約台帳']};
  const titles={properties:'物件一覧',units:'部屋一覧',parking:'駐車区画一覧'};
  const register=`<button type="button" class="primary" id="master-add">${icon('plus')}新規登録</button>`;
  const contractLink=kind==='parking'?`<a class="button" href="#new">${icon('file')}駐車区画付き申込</a>`:'';
  view.innerHTML=heading(names[kind],'',`<div class="heading-actions">${contractLink}${register}</div>`)
    +`<section class="panel master-panel"><div class="results-heading"><h2>${titles[kind]} <small id="master-count"></small></h2>
    <label class="master-search"><span class="sr-only">${titles[kind]}を検索</span><span class="keyword-input">${icon('search')}<input id="master-search" type="search" placeholder="キーワードで絞り込む"></span></label></div>
    <div id="master-list"></div><nav class="list-pager" aria-label="${titles[kind]}のページ"></nav></section>`;
  const list=view.querySelector('#master-list');
  const search=view.querySelector('#master-search');
  const pager=view.querySelector('.list-pager');
  const count=view.querySelector('#master-count');
  const add=view.querySelector('#master-add');
  const limit=listLimit(290,34);
  let page=1;
  function entries(item) {
    if (kind==='properties') return [item.name,item.address,item.branch];
    const base=[propertyName(item.property_id),item.label];
    if (kind==='units') return [...base,item.floor_plan,money(item.rent)];
    return [...base,money(item.fee),item.active_contract_id?'契約中':'空き',item.active_contract_id?`${item.starts_on} ～ ${item.ends_on}`:'—'];
  }
  function draw() {
    const term=search.value.trim().toLocaleLowerCase('ja');
    const filtered=master[kind].filter(item=>entries(item).some(value=>String(value??'').toLocaleLowerCase('ja').includes(term)));
    count.textContent=`${filtered.length} 件`;
    page=Math.min(page,Math.max(1,Math.ceil(filtered.length/limit)));
    const rows=filtered.slice((page-1)*limit,page*limit).map(item=>{
      const cells=entries(item).map(clean);
      if (kind!=='parking') return cells;
      return [...cells,item.active_contract_id?`<a class="master-link" href="#contract/${item.active_contract_id}">契約を開く</a>`:'—'];
    });
    list.innerHTML=table(cols[kind],rows);
    listPager(pager,page,filtered.length,limit,next=>{page=next;draw();});
  }
  search.oninput=()=>{page=1;draw();};
  add.onclick=()=>{
    const fields=kind==='properties'?field('name','物件名','text','',true)+field('address','所在地','text','',true)+field('branch','管理店','text','',true):
      `<label>物件<select name="property" required><option value="">選択してください</option>${propertyOptions()}</select></label>`+field('label',cols[kind][1],'text','',true)+(kind==='units'?field('floorPlan','間取り','text','',true):'')+field('fee',kind==='units'?'月額家賃':'月額利用料','number',0,true);
    const dialog=document.createElement('dialog');
    dialog.className='demo-dialog master-dialog';
    dialog.innerHTML=`<h2>${names[kind]}の新規登録</h2><form><div class="fields">${fields}</div><p class="review-note" role="alert"></p><div class="actions"><button class="primary" type="submit">登録する</button><button type="button" data-close>キャンセル</button></div></form>`;
    const form=dialog.querySelector('form');
    dialog.querySelector('[data-close]').onclick=()=>dialog.close();
    dialog.addEventListener('close',()=>{dialog.remove();add.focus({preventScroll:true});},{once:true});
    form.onsubmit=async event=>{
      event.preventDefault();
      event.submitter.disabled=true;
      try {
        await api(`master/${kind}`,'POST',Object.fromEntries(new FormData(form)));
        master=await api('master');
        search.value='';
        page=Math.max(1,Math.ceil(master[kind].length/limit));
        draw();
        dialog.close();
        toast('台帳に登録しました。');
      } catch (error) {dialog.querySelector('[role=alert]').textContent=error.message;}
      finally {event.submitter.disabled=false;}
    };
    document.body.append(dialog);
    dialog.showModal();
  };
  draw();
}

  const form=view.querySelector('#editor');

  if (!editable) {

    form.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);

  const selectTab=key=>{form.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===key)));form.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==key);};
  form.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
  form.addEventListener('invalid',event=>{const panel=event.target.closest('[data-panel]');if(panel) selectTab(panel.dataset.panel);},true);
  form.unitId.value=item?.unit_id || '';
  function parkingOptions(selected) {
    const unit=master.units.find(u=>u.id===Number(form.unitId.value));
    const spaces=master.parking.filter(p=>p.property_id===unit?.property_id);
    const renderOptions=value=>'<option value="">契約なし</option>'+spaces.map(p=>option(p.id,`${p.label} · ${money(p.fee)}`,value)).join('');
    form.parkingId.innerHTML=renderOptions(selected);
    const extra=form.elements.namedItem('parkingDetails.secondSpaceId');
    if(extra) extra.innerHTML=renderOptions(selected===item?.parking_id?data.parkingDetails?.secondSpaceId:undefined);
    return unit;
  }
  parkingOptions(item?.parking_id);
  function refreshTotals() {
    const n=k=>Number(form.elements.namedItem(`charges.${k}`).value||0);
    const second=form.elements.namedItem('parkingDetails.secondSpaceId');
    const ids=new Set([Number(form.parkingId.value),Number(second?.value)]);
    const fee=master.parking.filter(space=>ids.has(space.id)).reduce((sum,space)=>sum+space.fee,0);
    view.querySelector('#monthly').textContent=money(n('rent')+n('common')+n('monthlyOther')+n('supportFee')+n('reliefFee')+n('townMonthlyFee')+n('waterFee')+fee);
    const charges=Object.fromEntries(initialChargeItems.map(([key])=>[key,n(key)]));
    const allocation=Object.fromEntries(sections.billing[1].map(([key])=>[key,form.elements.namedItem(`billing.${key}`).value]));
    const split=splitInitialCharges(charges,allocation,form.elements.namedItem('party.type').value);
    view.querySelector('#initial').textContent=money(split.personal+split.corporate);
    view.querySelector('#initial-personal').textContent=money(split.personal);
    view.querySelector('#initial-corporate').textContent=money(split.corporate);

  form.unitId.onchange=()=>{const unit=parkingOptions();form.elements.namedItem('charges.rent').value=unit?.rent || 0;refreshTotals();};
  let dirty=false;
  form.addEventListener('input',()=>{dirty=true;refreshTotals();});
  form.addEventListener('change',event=>{
    const input=event.target;
    if(!input.dataset.filenameFor || !input.files[0]) return;
    form.elements.namedItem(input.dataset.filenameFor).value=input.files[0].name.slice(0,240);
    input.value='';
    dirty=true;
  });
  form.onsubmit=e=>{e.preventDefault();submit(e.submitter,async()=>{
    const payload=Object.fromEntries(new FormData(form));
    const {unitId,parkingId,startsOn,endsOn}=payload;
    const details=Object.fromEntries(Object.entries(sections).map(([key,[,fields]])=>[key,Object.fromEntries(fields.map(([name])=>[name,payload[`${key}.${name}`]]))]));
    const result=await api(item?`contracts/${item.id}`:'contracts',item?'PUT':'POST',{unitId,parkingId,startsOn,endsOn,revision:item?.revision,details});

    let endsOn;
    if(action==='renew') {endsOn=await renewalDate(item.ends_on);if(endsOn===null)return;}

    const result=await api(`contracts/${item.id}/status`,'POST',{action,revision:item.revision,endsOn});
    contractPage(result);toast('契約の状態を更新しました。');
  }));
  const printButton=view.querySelector('#print');
  if(printButton)printButton.onclick=()=>window.print();
  const payment=view.querySelector('#payment');
  if(payment)payment.onsubmit=e=>{e.preventDefault();submit(e.submitter,async()=>{const result=await api(`contracts/${item.id}/payments`,'POST',Object.fromEntries(new FormData(payment)));contractPage(result);toast('入金を記録しました。');});};
}

async function render() {
  dismissCalendar?.();
  const token=++renderCount;
  const route=location.hash.slice(1)||'search';
  const menuRoute=/^(contract\/|new$)/.test(route)?'search':route;
  document.querySelectorAll('.sidebar nav a').forEach(link=>{
    const active=link.hash===`#${menuRoute}`;
    link.classList.toggle('active',active);
    if(active) link.setAttribute('aria-current','page');
    else link.removeAttribute('aria-current');
  });
  document.querySelector('.demo-tools details')?.removeAttribute('open');
  try {
    if (!master || route==='parking') master=await api('master');
    if(token!==renderCount)return;
    if(route==='new') {
      contractPage();
      window.scrollTo(0,0);
      return;
    }
    if(/^contract\/\d+(\/(payments|end))?$/.test(route)) {
      const [,id,section]=route.split('/');
      const item=await api(`contracts/${id}`);
      if(token!==renderCount)return;
      contractPage(item);
      if(section==='payments') view.querySelector('#payment-history')?.scrollIntoView();
      else if(section==='end') view.querySelector('#editor .actions')?.scrollIntoView();
      else window.scrollTo(0,0);
      return;
    }
    if(['units','properties','parking'].includes(route)) {
      masterPage(route);
      window.scrollTo(0,0);
      return;
    }
    const loading=searchPage(token);
    window.scrollTo(0,0);
    await loading;
  } catch(error) {
    if(token===renderCount)view.innerHTML=`<section class="panel"><h1>読込エラー</h1><p>${clean(error.message)}</p><a href="#search">検索一覧へ</a></section>`;
  }
}

function readDemo() {
  try {
    const data = localStorage.getItem(demoKey);
    if (data) return JSON.parse(data);
  } catch { /* The demo remains usable without browser storage. */ }
  return structuredClone(sample);
}
let demo = readDemo();
function exportDemo() {
  const file = new Blob([JSON.stringify(demo,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'sumai-demo.json';
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function persistDemo() {
  try { localStorage.setItem(demoKey,JSON.stringify(demo)); }
  catch { /* The downloaded JSON is the fallback. */ }
}
const demoId = rows => Math.max(0,...rows.map(row=>row.id))+1;
function demoCheck(condition,message) { if (!condition) throw Error(message); }
const demoParkingIds=contract=>[contract.parking_id,contract.details.parkingDetails?.secondSpaceId].filter(Boolean);
function demoOccupied(unit,spaceIds,exceptId) {
  return demo.contracts.some(row=>row.id!==exceptId && row.status==='ACTIVE' &&
    (row.unit_id===unit || demoParkingIds(row).some(id=>spaceIds.includes(id))));
}
function demoDetail(contract) {
  const unit = demo.units.find(row=>row.id===contract.unit_id);
  const property = demo.properties.find(row=>row.id===unit.property_id);
  const parking = demo.parking.filter(row=>demoParkingIds(contract).includes(row.id));
  const parkingFee = parking.reduce((sum,row)=>sum+row.fee,0);
  return {...contract,unit:unit.label,floor_plan:unit.floor_plan,property:property.name,branch:property.branch,
    address:property.address,parking:parking.map(row=>row.label).join(' / '),parking_fee:parkingFee,totals:totals(contract.details.charges,parkingFee)};
}
function demoEvent(contract,event) {
  contract.events.unshift({event,created_at:new Date().toISOString()});

function demoRequest(path,method,body) {
  const [route,query] = path.split('?');
  if (route==='master') return {
    properties:demo.properties,
    units:demo.units.map(unit=>({...unit,property:demo.properties.find(p=>p.id===unit.property_id).name})),
    parking:demo.parking.map(space=>{
      const active=demo.contracts.find(c=>c.status==='ACTIVE' && demoParkingIds(c).includes(space.id));
      return {...space,active_contract_id:active?.id,starts_on:active?.starts_on,ends_on:active?.ends_on};
    }),
  };
  if (route.startsWith('master/')) {
    const kind=route.split('/')[1];
    const rows=demo[kind];
    const id=demoId(rows);
    if (kind==='properties') rows.push({id,name:body.name,address:body.address,branch:body.branch});
    else {
      const property_id=Number(body.property);
      demoCheck(!rows.some(row=>row.property_id===property_id && row.label===body.label),'同じ番号が登録されています。');
      rows.push({id,property_id,label:body.label,...(kind==='units'?{floor_plan:body.floorPlan,rent:Number(body.fee)}:{fee:Number(body.fee)})});
    }
    return {id};
  }
  if (route==='contracts' && method==='GET') {
    const params=new URLSearchParams(query);
    const q=(params.get('q')||'').toLowerCase();
    const digits=value=>String(value||'').replace(/\D/g,'');
    const phone=digits(params.get('phone'));
    return demo.contracts.slice().reverse().map(demoDetail).filter(row=>{
      const {party,occupant,related}=row.details;
      const household=Object.entries(related).filter(([key])=>/^member\d+(Name|Kana)$/.test(key)).map(([,value])=>value);
      const searchable=[row.property,row.unit,row.address,row.branch,row.parking,party.name,party.kana,party.vehicleNo,party.employer,
        occupant.name,occupant.kana,occupant.employer,related.occupants,related.guarantor,related.guarantorKana,
        related.secondGuarantor,related.secondGuarantorKana,row.details.application.receiptNo,...household];
      return searchable.join(' ').toLowerCase().includes(q)
        && (!phone || [party.phone,occupant.phone,occupant.homePhone,occupant.mobilePhone,occupant.otherPhone,
          related.guarantorPhone,related.guarantorMobile,related.secondGuarantorPhone,related.secondGuarantorMobile].some(number=>digits(number).includes(phone)))
        && (!params.get('status') || params.get('status')===row.status)
        && (!params.get('unit') || Number(params.get('unit'))===row.unit_id)
        && (!params.get('property') || Number(params.get('property'))===demo.units.find(u=>u.id===row.unit_id).property_id);
    });
  }
  const [,id,action]=route.split('/');
  let contract=demo.contracts.find(row=>row.id===Number(id));
  if (route==='contracts' || method==='PUT') {
    if (method==='PUT') demoCheck(['DRAFT','ACTIVE','APPROVED'].includes(contract?.status) && contract.revision===body.revision,'契約を読み直してください。');
    const unit=demo.units.find(row=>row.id===Number(body.unitId));
    const parking=body.parkingId && demo.parking.find(row=>row.id===Number(body.parkingId));
    demoCheck(unit && (!body.parkingId || parking?.property_id===unit.property_id),'部屋・駐車区画を確認してください。');
    const start=dateOrNull(body.startsOn), end=dateOrNull(body.endsOn);
    demoCheck(!start || !end || start<=end,'終了日は開始日以降を選択してください。');
    const details=normalize(body.details);
    const extra=details.parkingDetails.secondSpaceId;
    if(extra) demoCheck(parking && extra!==parking.id && demo.parking.some(space=>space.id===extra && space.property_id===unit.property_id),'2台目には別の駐車区画を選択してください。');
    if (contract?.status==='ACTIVE') {
      demoCheck(start && end,'契約期間を設定してください。');
      demoCheck(!demoOccupied(unit.id,[parking?.id,extra],contract.id),'同じ部屋・駐車区画に有効な契約があります。');
    }
    demoCheck(details.party.name,'契約者名を入力してください。');
    for (const section of Object.values(details)) {
      for (const [key,value] of Object.entries(section)) {
        if (key.endsWith('On')) dateOrNull(value);
        if (key.endsWith('Month') && value) dateOrNull(value+'-01');
      }
    }
    if (!contract) {
      contract={id:demoId(demo.contracts),revision:0,status:'DRAFT',payments:[],events:[]};
      demo.contracts.push(contract);
    }
    Object.assign(contract,{revision:contract.revision+1,unit_id:unit.id,parking_id:parking?.id??null,starts_on:start,ends_on:end,details});
    demoEvent(contract,method==='PUT'?'申込を更新':'申込を登録');
  } else {
    demoCheck(contract,'対象データが見つかりません。');
    if (action==='status') {
      const status=nextStatus[contract.status]?.[body.action];
      demoCheck(Object.values(nextStatus[contract.status]||{}).includes(status) && contract.revision===body.revision,'現在の状態では操作できません。');
      if (body.action==='activate') {
        demoCheck(contract.starts_on && contract.ends_on,'契約開始日と終了日を設定してください。');
        demoCheck(!demoOccupied(contract.unit_id,demoParkingIds(contract),contract.id),'同じ部屋・駐車区画に有効な契約があります。');
      }
      if (body.action==='reject') demoCheck(contract.details.review.note,'審査メモに理由を入力してください。');
      if (body.action==='renew') {
        const end=dateOrNull(body.endsOn);
        demoCheck(end && end>contract.ends_on,'更新後の終了日は現在の終了日より後にしてください。');
        contract.ends_on=end;
      }
      contract.status=status;
      contract.revision++;
      demoEvent(contract,{approve:'審査を承認',reject:'審査を却下',activate:'契約を確定',renew:'契約を更新',end:'契約を終了'}[body.action]);
    }
    if (action==='payments') {
      const amount=Number(body.amount), received_on=dateOrNull(body.receivedOn);
      demoCheck(['APPROVED','ACTIVE'].includes(contract.status) && received_on && Number.isInteger(amount) &&
        amount>0 && amount<=maxYen,'入金日と入金額を確認してください。');
      contract.payments.unshift({amount,received_on,memo:String(body.memo||'')});
      demoEvent(contract,'入金を記録');
    }
  }
  return demoDetail(contract);
}
async function demoApi(path,method='GET',body) {
  const result=demoRequest(path,method,body);
  if (method!=='GET') { persistDemo(); exportDemo(); }
  return structuredClone(result);
}

function demoDialog(title,content,save) {
  const dialog=document.createElement('dialog');
  dialog.className='demo-dialog';
  dialog.innerHTML=`<h2>${clean(title)}</h2><form>${content}<p role="alert" class="review-note"></p><div class="actions"><button class="primary">保存</button><button type="button" data-close>閉じる</button></div></form>`;
  document.body.append(dialog);
  dialog.querySelector('[data-close]').onclick=()=>dialog.close();
  dialog.addEventListener('close',()=>dialog.remove(),{once:true});
  dialog.querySelector('form').onsubmit=event=>{
    event.preventDefault();
    try {
      save(Object.fromEntries(new FormData(event.currentTarget)));
      persistDemo();
      exportDemo();
      dialog.close();
      toast('デモデータを保存しました。');
    } catch (error) { dialog.querySelector('[role=alert]').textContent=error.message; }
  };
  dialog.showModal();
}
function renderDemoActions(target,row) {
  const contract=demo.contracts.find(item=>item.id===row.id);
  if (contract.status==='ACTIVE') {
    const moveOut=document.createElement('button');
    moveOut.type='button';
    moveOut.textContent='退居予定';
    moveOut.onclick=()=>demoDialog('退居受付',field('date','退居予定日','date',contract.moveOutOn||'',true)+
      field('reason','退居理由・精算メモ','textarea',contract.moveOutMemo||''),form=>{
      const date=dateOrNull(form.date);
      demoCheck(date && date>=contract.starts_on,'契約開始日以降の退居日を選択してください。');
      contract.moveOutOn=date;
      contract.moveOutMemo=form.reason.trim();
      demoEvent(contract,'退居予定：'+date+(contract.moveOutMemo?' '+contract.moveOutMemo:''));
    });
    target.append(moveOut);
  }
  const actions=[
    ['クレーム登録','相談・対応内容'],
    ['日報','日報メモ'],
    ['契約紐付け','関連契約'],
  ];
  for (const [title,label] of actions) {
    const button=document.createElement('button');
    button.type='button';
    button.textContent=title;
    button.onclick=()=>{
      const existing=contract.events.filter(event=>event.event.startsWith(title+'：'));
      const history=existing.length?`<ul>${existing.map(event=>`<li>${clean(event.event)}</li>`).join('')}</ul>`:'';
      const candidates=demo.contracts.filter(item=>item.id!==contract.id);
      const linking=title==='契約紐付け';
      if(linking && !candidates.length) {toast('紐付け先の契約がありません。',true);return;}
      const fields=linking?`<label>${label}<select name="value" required><option value="">選択してください</option>${candidates.map(item=>option(item.id,`#${item.id} ${item.details.party.name}`)).join('')}</select></label>`:field('value',label,'textarea','',true);
      demoDialog(title,history+fields,form=>{
        const value=form.value.trim();
        demoCheck(value,'内容を入力してください。');
        if(linking) {
          const related=candidates.find(item=>item.id===Number(value));
          demoCheck(related && !(contract.linkedContracts||[]).includes(related.id),'紐付け先を確認してください。');
          (contract.linkedContracts??=[]).push(related.id);
          demoEvent(related,`契約紐付け：#${contract.id}`);
        }
        demoEvent(contract,`${title}：${linking?'#':''}${value}`);
      });
    };
    target.append(button);
  }
}

function renderDemoContractTools(item) {
  const contract=demo.contracts.find(row=>row.id===item.id);
  const tools=document.createElement('div');
  tools.className='panel grid-actions';
  tools.setAttribute('aria-label','帳票・作成依頼');
  const add=(label,run)=>{
    const button=document.createElement('button');
    button.type='button';
    button.textContent=label;
    button.onclick=run;
    tools.append(button);
  };
  add('履歴コメント',()=>demoDialog('履歴コメント',field('value','コメント','textarea','',true),form=>{
    demoCheck(form.value.trim(),'コメントを入力してください。');
    demoEvent(contract,'履歴コメント：'+form.value.trim());
    render();
  }));
  const split=splitInitialCharges(item.details.charges,item.details.billing,item.details.party.type);
  const app=item.details.application;
  const documents=[
    ['送付状',[['ご案内','お申し込みに関する書類をご確認ください。']]],
    ['重要事項説明書',[['説明日',app.explanationOn],['説明方法',app.explanationMethod],['契約の種類',app.leaseType]]],
    ['申込書',[['受付番号',app.receiptNo],['申込日',app.receivedOn],['申込者',app.applicantName],['契約希望日',app.desiredContractOn]]],
    ['概算費用見積書',[['月額合計',money(item.totals.monthly)],['初期費用・個人負担',money(split.personal)],['初期費用・法人負担',money(split.corporate)]]],
    ['手付金確認票',[['手付金',money(item.totals.advancePayment)],['個人入金日',app.depositPersonalOn],['法人入金日',app.depositCorporateOn]]],
    ['契約書',[['契約日',app.signedOn],['契約期間',(item.starts_on||'')+' ～ '+(item.ends_on||'')],['月額合計',money(item.totals.monthly)]]],
  ];
  const printMenu=document.createElement('details');
  printMenu.className='tool-menu document-menu';
  printMenu.innerHTML=`<summary>${icon('print')}帳票プレビュー</summary><div class="menu-popover"></div>`;
  tools.append(printMenu);
  for (const [title,rows] of documents) {
    const button=document.createElement('button');
    button.type='button';
    button.textContent=title;
    button.onclick=()=>{
      const print=view.querySelector('.print-sheet');
      const template=print.innerHTML;
      printMenu.open=false;
      print.innerHTML=`<h1>${title}</h1><p>画面確認用のサンプル帳票</p><p>${clean(item.details.party.name)} 様</p>`+
        table(['項目','内容'],[['物件・号室',item.property+' '+item.unit],...rows].map(row=>row.map(value=>clean(value||'—'))));
      window.addEventListener('afterprint',()=>{print.innerHTML=template;},{once:true});
      window.print();
    };
    printMenu.querySelector('.menu-popover').append(button);
  }
  for (const title of ['車庫承諾書作成依頼','契約書作成依頼']) {
    add(title,()=>demoDialog(title,field('value','依頼メモ','textarea'),form=>{
      demoEvent(contract,`${title}：${form.value.trim() || 'デモ依頼を登録'}`);
      render();
    }));
  }
  view.querySelector('#editor').before(tools);
}

function parseDemo(text) {
  const data=JSON.parse(text);
  const validId=value=>Number.isSafeInteger(value) && value>0;
  demoCheck(data?.version===1,'住まい台帳デモのJSONを選択してください。');
  for (const key of ['properties','units','parking','contracts']) {
    const rows=data[key];
    demoCheck(Array.isArray(rows) && rows.length<=1000 && rows.every(row=>validId(row?.id)) &&
      new Set(rows.map(row=>row.id)).size===rows.length,'台帳データを確認してください。');
  }
  const propertyExists=id=>data.properties.some(row=>row.id===id);
  for (const row of [...data.units,...data.parking]) {
    demoCheck(propertyExists(row.property_id),'物件情報を確認してください。');
  }
  for (const row of data.contracts) {
    const unit=data.units.find(unit=>unit.id===row.unit_id);
    demoCheck(unit && (row.parking_id===null || data.parking.some(p=>p.id===row.parking_id && p.property_id===unit.property_id)) &&
      ['DRAFT','APPROVED','ACTIVE','REJECTED','ENDED'].includes(row.status) && validId(row.revision) &&
      Array.isArray(row.events) && Array.isArray(row.payments),'契約データを確認してください。');
    dateOrNull(row.starts_on);
    dateOrNull(row.ends_on);
    row.details=normalize(row.details);
    const extra=row.details.parkingDetails.secondSpaceId;
    demoCheck(!extra || (row.parking_id && extra!==row.parking_id &&
      data.parking.some(space=>space.id===extra && space.property_id===unit.property_id)),'2台目の駐車区画を確認してください。');
  }
  return data;
}
document.querySelector('#demo-export').onclick=exportDemo;
document.querySelector('#demo-import').onchange=async event=>{
  const control=event.currentTarget;
  try {
    const file=control.files[0];
    if (!file) return;
    demoCheck(file.size<=5_000_000,'JSONファイルは5 MBまでです。');
    const imported=parseDemo(await file.text());
    if (!confirm('このブラウザのデモデータをファイルの内容で置き換えますか？')) return;
    demo=imported;
    persistDemo();
    master=undefined;
    location.hash='search';
    await render();
    toast('デモデータを読み込みました。');
  } catch (error) { toast(error.message,true); }
  finally { control.value=''; }
};

render();</script>
